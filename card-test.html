<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Generator Test</title>
<script src="/node_modules/jspdf/dist/jspdf.umd.js"></script>
<script src="/node_modules/jsbarcode/dist/JsBarcode.all.min.js"></script>
<style>
  body { margin: 0; background: #1a1d27; font-family: sans-serif; color: #e8eaf0; }
  h2 { padding: 16px; margin: 0; background: #21263a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; }
  .card-box { background: #21263a; border-radius: 10px; padding: 16px; }
  .card-box h3 { margin: 0 0 12px; font-size: 13px; color: #7c839e; text-transform: uppercase; letter-spacing: .06em; }
  iframe { border: none; border-radius: 4px; display: block; width: 100%; }
  .status { padding: 8px 24px; color: #2dd4a0; font-size: 13px; }
</style>
</head>
<body>
<h2>Card Generator — Visual Test</h2>
<p class="status" id="status">Generating cards…</p>
<div class="grid">
  <div class="card-box"><h3>ID Card — Front</h3><iframe id="id-front" height="400"></iframe></div>
  <div class="card-box"><h3>ID Card — Back</h3><iframe id="id-back" height="400"></iframe></div>
  <div class="card-box"><h3>Business Card — Front</h3><iframe id="biz-front" height="280"></iframe></div>
  <div class="card-box"><h3>Business Card — Back</h3><iframe id="biz-back" height="280"></iframe></div>
</div>
<script>
// ─── Test data (matches the reference sample) ────────────────────
const STAFF = {
  full_name: "Ojo Kayode Emmanuel",
  employee_number: "123-456-7890",
  email: "kayode2015@gmail.com",
  phone: "+234 7065950231",
  job_title: "Internal Control Officer",
  role: "Internal Control Officer"
};

// ─── Brand colours ────────────────────────────────────────────────
const NAVY  = [13, 27, 75];
const CYAN  = [0, 188, 212];
const BLUE  = [25, 82, 163];
const WHITE = [255, 255, 255];
const DARK  = [15, 22, 55];
const MID   = [80, 90, 130];
const GRID  = [228, 235, 248];

const ADDRESS = 'No 1 Dutse, Off Bwari Expressway, Bmuko Village, Abuja, Nigeria';
const TERMS_ID  = 'Employees are required to keep their ID badge visible or easily accessible during working hours to confirm identity when needed.';
const TERMS_USE = 'The ID badge is issued solely for company-related activities. It may not be lent, duplicated, or used for any non-official purpose.';
const PRODUCTS  = [
  'High Quality Turkish Designed Blocks',
  'Paving Stones (Interlocks)',
  'Kerb Stones',
  'Quarry Materials (Chippings, Stone Base, Stone dust, hard core)',
];

// ─── Helpers ─────────────────────────────────────────────────────
async function fetchLogoIconAsDataUrl() {
  try {
    const res = await fetch('/logo-icon.png');
    if (!res.ok) return null;
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  } catch { return null; }
}

function makeBarcodeDataUrl(value) {
  const canvas = document.createElement('canvas');
  JsBarcode(canvas, value || 'APC', {
    format: 'CODE128', width: 2, height: 50,
    displayValue: false, margin: 4,
    background: '#ffffff', lineColor: '#000000',
  });
  return canvas.toDataURL('image/png');
}

// ─── ID Card front ────────────────────────────────────────────────
function drawIDFront(doc, staff, iconUrl, photoUrl, photoFmt, barcode, W, H, SB, CW) {
  doc.setFillColor(...WHITE); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(...GRID); doc.setLineWidth(0.08);
  for (let x=2;x<CW;x+=4) doc.line(x,0,x,H);
  for (let y=2;y<H;y+=4) doc.line(0,y,CW,y);
  doc.setFillColor(...NAVY); doc.rect(CW,0,SB,H,'F');
  const jobTitle = (staff.job_title?.trim() || staff.role || 'STAFF').toUpperCase();
  doc.setTextColor(...WHITE); doc.setFont('helvetica','bold'); doc.setFontSize(6.5);
  const jTW = doc.getTextWidth(jobTitle);
  doc.text(jobTitle, CW+SB/2, H/2+jTW/2, {angle:90});
  doc.addImage(iconUrl,'PNG',2,2,9,9);
  doc.setTextColor(...MID); doc.setFont('helvetica','bold'); doc.setFontSize(5.5);
  doc.text('Abuja Precast',12.5,5);
  doc.text('Concrete Ltd',12.5,8.5);
  const PW=28,PH=28,PX=(CW-PW)/2,PY=16,B=1.2;
  doc.setFillColor(...CYAN); doc.rect(PX-B,PY-B,PW+2*B,PH+2*B,'F');
  if (photoUrl) { doc.addImage(photoUrl,photoFmt,PX,PY,PW,PH); }
  else {
    doc.setFillColor(235,240,250); doc.rect(PX,PY,PW,PH,'F');
    doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(170,180,205);
    doc.text('PHOTO',PX+PW/2,PY+PH/2+1,{align:'center'});
  }
  const nameParts=(staff.full_name||'').trim().split(/\s+/);
  const nameY=PY+PH+5;
  doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  const mid=Math.ceil(nameParts.length/2);
  if (nameParts.length<=2) { doc.text(staff.full_name||'',CW/2,nameY,{align:'center'}); }
  else {
    doc.text(nameParts.slice(0,mid).join(' '),CW/2,nameY,{align:'center'});
    doc.text(nameParts.slice(mid).join(' '),CW/2,nameY+4,{align:'center'});
  }
  let dy=nameY+(nameParts.length>2?9:5);
  doc.setFontSize(5);
  const detailRow=(label,value)=>{
    const v=value.length>23?value.slice(0,22)+'…':value;
    doc.setFont('helvetica','bold'); doc.setTextColor(...DARK); doc.text(label,3,dy);
    doc.setFont('helvetica','normal'); doc.setTextColor(55,60,90); doc.text(`: ${v}`,14,dy);
    dy+=3.5;
  };
  detailRow('ID No', staff.employee_number||'—');
  if (staff.email)        detailRow('Email', staff.email);
  if (staff.phone?.trim()) detailRow('Phone', staff.phone.trim());
  const BW=CW-4, BH=7;
  doc.addImage(barcode,'PNG',2,H-BH-10,BW,BH);
  doc.setFillColor(...CYAN);
  doc.rect(0,H-9,5,4.5,'F');
  doc.rect(0,H-4,5,4.5,'F');
}

// ─── ID Card back ────────────────────────────────────────────────
function drawIDBack(doc, iconUrl, W, H) {
  doc.setFillColor(...WHITE); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(...GRID); doc.setLineWidth(0.08);
  for (let x=2;x<W;x+=4) doc.line(x,0,x,H);
  for (let y=2;y<H;y+=4) doc.line(0,y,W,y);
  doc.setFillColor(...CYAN);
  doc.rect(W-8,0,8,4.5,'F'); doc.rect(W-5.5,4.5,5.5,4,'F');
  doc.rect(W-8,H-4.5,8,4.5,'F'); doc.rect(W-5.5,H-8.5,5.5,4,'F');
  doc.rect(0,0,4.5,4.5,'F'); doc.rect(0,H-4.5,4.5,4.5,'F');
  doc.addImage(iconUrl,'PNG',3,5,10,10);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...DARK);
  doc.text('ABUJA PRECAST',15,8.5);
  doc.setFontSize(7); doc.setTextColor(...MID);
  doc.text('CONCRETE LIMITED',15,13.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...DARK);
  doc.text('TERMS & CONDITIONS',4,21);
  const FS=5.5, LINE_H=FS*1.25/2.8346;
  let y=26.5;
  const inlineClause=(title,body)=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(FS); doc.setTextColor(...DARK);
    const titleW=doc.getTextWidth(title+' ');
    doc.text(title,4,y);
    doc.setFont('helvetica','normal'); doc.setTextColor(50,55,80);
    const availFirst=W-8-titleW;
    const firstLine=availFirst>4?(doc.splitTextToSize(body,availFirst)[0]||''):'';
    if (firstLine) doc.text(firstLine,4+titleW,y);
    const remaining=body.slice(firstLine.length).trimStart();
    if (remaining) {
      const restLines=doc.splitTextToSize(remaining,W-8);
      doc.text(restLines,4,y+LINE_H);
      y+=LINE_H*(1+restLines.length)+4;
    } else { y+=LINE_H+4; }
  };
  inlineClause('Identification:',TERMS_ID);
  inlineClause('Proper Use:',TERMS_USE);
  y+=3;
  doc.setFont('helvetica','bold'); doc.setFontSize(5.5); doc.setTextColor(...DARK);
  const addrLines=doc.splitTextToSize(`Address: ${ADDRESS}`,W-8);
  doc.text(addrLines,4,y);
}

// ─── Business card front ──────────────────────────────────────────
function drawBizFront(doc, staff, iconUrl, W, H) {
  doc.setFillColor(...WHITE); doc.rect(0,0,W,H,'F');
  doc.addImage(iconUrl,'PNG',4,3,12,12);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...DARK);
  doc.text('ABUJA',18,8.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(...MID);
  doc.text('PRECAST CONCRETE',18,13);
  const lnX1=35, lnX2=W-4, lnMid=(lnX1+lnX2)/2, lnY=9.5;
  doc.setLineWidth(0.8);
  doc.setDrawColor(190,195,215); doc.line(lnX1,lnY,lnMid,lnY);
  doc.setDrawColor(...BLUE);     doc.line(lnMid,lnY,lnX2,lnY);
  doc.setDrawColor(225,230,245); doc.setLineWidth(0.3); doc.line(4,17,W-4,17);
  const name=(staff.full_name||'').toUpperCase();
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...DARK);
  const nameLines=doc.splitTextToSize(name,W-10);
  const nameY=24;
  doc.text(nameLines,5,nameY);
  const LINE_H_11=11*1.2/2.8346;
  const afterNameY=nameY+nameLines.length*LINE_H_11;
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...BLUE);
  doc.text(staff.job_title||staff.role||'',5,afterNameY+2);
  doc.setDrawColor(225,230,245); doc.setLineWidth(0.3); doc.line(5,afterNameY+6,W-5,afterNameY+6);
  let cy=afterNameY+11;
  const R=2.0, LINE_H=6.5*1.2/2.8346;
  const drawIconCircle=(x,y,type)=>{
    doc.setFillColor(...BLUE); doc.circle(x,y,R,'F');
    doc.setFillColor(...WHITE); doc.setDrawColor(...WHITE);
    if (type==='phone') {
      doc.setLineWidth(0.5);
      doc.line(x-1.0,y+0.85,x+1.0,y-0.85);
      doc.circle(x-0.85,y+0.75,0.32,'F'); doc.circle(x+0.85,y-0.75,0.32,'F');
    } else if (type==='email') {
      doc.setLineWidth(0.28);
      doc.rect(x-1.1,y-0.65,2.2,1.4);
      doc.line(x-1.1,y-0.65,x,y+0.15); doc.line(x+1.1,y-0.65,x,y+0.15);
    } else if (type==='location') {
      doc.circle(x,y-0.5,0.75,'F');
      doc.setLineWidth(0.4);
      doc.line(x-0.55,y+0.15,x,y+1.1); doc.line(x+0.55,y+0.15,x,y+1.1);
    }
  };
  const contactLine=(text,type)=>{
    drawIconCircle(6.5,cy-1.0,type);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(45,50,80);
    const lines=doc.splitTextToSize(text,W-16);
    doc.text(lines,11,cy);
    cy+=lines.length*LINE_H+1.5;
  };
  const phone=staff.phone?.trim();
  if (phone)       contactLine(phone,'phone');
  if (staff.email) contactLine(staff.email,'email');
  contactLine(ADDRESS,'location');
}

// ─── Business card back ───────────────────────────────────────────
function drawBizBack(doc, iconUrl, W, H) {
  doc.setFillColor(...WHITE); doc.rect(0,0,W,H,'F');
  const ICON_W=14,ICON_H=14,lx=W/2-20;
  doc.addImage(iconUrl,'PNG',lx,3,ICON_W,ICON_H);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...DARK);
  doc.text('ABUJA PRECAST',lx+16,9);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...MID);
  doc.text('CONCRETE LIMITED',lx+16,14.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...DARK);
  doc.text('OUR PRODUCTS',5,25);
  doc.setDrawColor(...DARK); doc.setLineWidth(0.4); doc.line(5,26.5,47,26.5);
  doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(...DARK);
  let py=32;
  const LINE_H_75=7.5*1.2/2.8346;
  for (const p of PRODUCTS) {
    const lines=doc.splitTextToSize(`¤  ${p}`,W-12);
    doc.text(lines,6,py);
    py+=lines.length*LINE_H_75+1;
  }
}

// ─── Main test runner ─────────────────────────────────────────────
async function run() {
  const { jsPDF } = window.jspdf;
  const iconUrl  = await fetchLogoIconAsDataUrl();
  const barcode  = makeBarcodeDataUrl(STAFF.employee_number);

  // ── ID Card ──
  const W_ID=54, H_ID=86, SB=11, CW=W_ID-SB;
  const idDoc = new jsPDF({orientation:'portrait',unit:'mm',format:[W_ID,H_ID]});
  drawIDFront(idDoc, STAFF, iconUrl, null, 'JPEG', barcode, W_ID, H_ID, SB, CW);
  document.getElementById('id-front').src = idDoc.output('datauristring');

  idDoc.addPage([W_ID,H_ID],'portrait');
  drawIDBack(idDoc, iconUrl, W_ID, H_ID);
  // Re-render back page only
  const idBackDoc = new jsPDF({orientation:'portrait',unit:'mm',format:[W_ID,H_ID]});
  drawIDBack(idBackDoc, iconUrl, W_ID, H_ID);
  document.getElementById('id-back').src = idBackDoc.output('datauristring');

  // ── Business Card ──
  const W_BIZ=85, H_BIZ=55;
  const bizFrontDoc = new jsPDF({orientation:'landscape',unit:'mm',format:[W_BIZ,H_BIZ]});
  drawBizFront(bizFrontDoc, STAFF, iconUrl, W_BIZ, H_BIZ);
  document.getElementById('biz-front').src = bizFrontDoc.output('datauristring');

  const bizBackDoc = new jsPDF({orientation:'landscape',unit:'mm',format:[W_BIZ,H_BIZ]});
  drawBizBack(bizBackDoc, iconUrl, W_BIZ, H_BIZ);
  document.getElementById('biz-back').src = bizBackDoc.output('datauristring');

  document.getElementById('status').textContent = 'Cards generated ✓';
  document.getElementById('status').style.color = '#2dd4a0';
  document.body.setAttribute('data-ready','true');
}

run().catch(e => {
  document.getElementById('status').textContent = 'Error: ' + e.message;
  document.getElementById('status').style.color = '#f06b6b';
  console.error(e);
});
</script>
</body>
</html>
